name: Preview release

# Fork-local. Everything that makes knd775/houdini differ from upstream lives on
# this branch. It shares no history with main and is never merged, so main stays
# identical to HoudiniGraphql/houdini. Main therefore always fast-forwards, and a
# branch cut from it is clean enough to PR upstream.
#
# Four ways in. The comment, checkbox and button paths all depend on this branch
# being the repository's default branch, because GitHub fires issue_comment,
# issues and workflow_dispatch only for workflow files that live there.
#
#   tick a checkbox on the Preview builds issue
#   comment /preview, /preview <sha> or /sync on any issue in this repo
#   press Run workflow in the Actions tab
#   git commit --allow-empty -m "chore: build preview" && git push origin preview
#
# /sync and the sync checkbox fast-forward main and stop there, which is the
# replacement for the Sync fork button. GitHub only offers that button on the
# default branch, and the default branch is this one now.
on:
    push:
        branches: [preview]
    workflow_dispatch:
    issue_comment:
        types: [created]
    issues:
        types: [edited]

# Two builds racing to publish the same sha would also fight over main's
# fast-forward, so a newer build supersedes one already running. A sync is quick
# and harmless, so it queues behind a build instead of killing it.
concurrency:
    group: preview
    cancel-in-progress: >-
        ${{ !startsWith(github.event.comment.body, '/sync') &&
            !contains(github.event.issue.body, '- [x] Sync main with upstream') }}

env:
    UPSTREAM: HoudiniGraphql/houdini

    # Platform packages to publish, as <nodeOS>-<cpu>. Add `wasm` for the WASI
    # build. Each entry is a separate cross-compiled Go binary, so this list is
    # kept to the platforms we install on, and the rest are dropped from
    # optionalDependencies rather than left pointing at versions npm can't serve.
    PLATFORMS: linux-x64 darwin-arm64

    # Packages whose publishable form is build/<name>, not the source directory.
    GO_PACKAGES: houdini-core houdini-react houdini-svelte

    # Fast-forward main to upstream before building. pkg.pr.new keys a preview on
    # a commit in this repository, so turning this off means previews are only
    # addressable while main already has the commit being built.
    SYNC_MAIN: true

jobs:
    preview:
        name: Publish preview packages
        # Anyone can comment on a public fork, so the comment and checkbox paths
        # are owner-only. The repository check keeps this out of forks of the fork.
        if: >-
            github.repository == 'knd775/houdini' && (
              github.event_name == 'push' ||
              github.event_name == 'workflow_dispatch' ||
              (github.event_name == 'issue_comment' &&
                github.event.sender.login == github.repository_owner &&
                (startsWith(github.event.comment.body, '/preview') ||
                 startsWith(github.event.comment.body, '/sync'))) ||
              (github.event_name == 'issues' &&
                github.event.sender.login == github.repository_owner &&
                (contains(github.event.issue.body, '- [x] Build a preview') ||
                 contains(github.event.issue.body, '- [x] Sync main with upstream')))
            )
        runs-on: ubuntu-22.04
        permissions:
            contents: write # fast-forwards main
            issues: write # reacts, resets the checkbox, posts the install URLs
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Work out what was asked for
              # Bodies arrive through env rather than ${{ }} so that a comment
              # can't inject shell, owner-only trigger or not.
              env:
                  COMMENT_BODY: ${{ github.event.comment.body }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  COMMENT_ID: ${{ github.event.comment.id }}
              run: |
                  mode=preview
                  ref=

                  case "$GITHUB_EVENT_NAME" in
                      issue_comment)
                          echo "ISSUE=$ISSUE_NUMBER" >> "$GITHUB_ENV"
                          echo "COMMENT_ID=$COMMENT_ID" >> "$GITHUB_ENV"
                          command=$(printf '%s' "$COMMENT_BODY" | head -1 | tr -d '\r')
                          case "$command" in
                              /sync*) mode=sync ;;
                              # anything after /preview is a commit to build
                              /preview*) ref=$(printf '%s' "$command" | awk '{print $2}') ;;
                          esac
                          ;;
                      issues)
                          echo "ISSUE=$ISSUE_NUMBER" >> "$GITHUB_ENV"
                          case "$ISSUE_BODY" in
                              *'- [x] Build a preview'*) mode=preview ;;
                              *) mode=sync ;;
                          esac
                          ;;
                  esac

                  # Validate before it reaches git, and fail rather than
                  # silently building main when a typo was meant as a sha.
                  if [ -n "$ref" ]; then
                      case "$ref" in
                          *[!0-9a-fA-F]*)
                              echo "::error::\"$ref\" is not a commit sha"
                              exit 1
                              ;;
                      esac
                      if [ "${#ref}" -lt 7 ] || [ "${#ref}" -gt 40 ]; then
                          echo "::error::\"$ref\" is not a commit sha"
                          exit 1
                      fi
                  fi

                  echo "MODE=$mode" >> "$GITHUB_ENV"
                  echo "REF=$ref" >> "$GITHUB_ENV"
                  echo "Mode: $mode. Commit: ${ref:-upstream main}."

            - name: Acknowledge the request
              if: env.ISSUE != ''
              run: |
                  if [ -n "$COMMENT_ID" ]; then
                      gh api --silent -X POST \
                          "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
                          -f content=eyes
                  else
                      # Clear the checkbox immediately. Ticking it again is then a
                      # second build, and a failed run doesn't leave it stuck on.
                      body=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .body |
                          sed 's/^- \[x\] /- [ ] /')
                      gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/issues/$ISSUE" -f body="$body"
                  fi

            - name: Check out main
              uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0

            # Checked out second and into a subdirectory, because the step above
            # owns the root. workflow_sha pins the tooling to the same commit as
            # this workflow file, whichever event triggered it.
            - name: Check out this branch's tooling
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.workflow_sha }}
                  path: .preview

            - name: Resolve the commit to build
              run: |
                  git remote add upstream "https://github.com/$UPSTREAM"

                  if [ -n "$REF" ]; then
                      # Building a named commit is a one-off, so leave main alone.
                      # Most shas are already here from main's history; a fetch
                      # covers the rest, and GitHub refuses shas it doesn't have.
                      git fetch --no-tags upstream main || true
                      git fetch --no-tags upstream "$REF" 2>/dev/null || true
                      if ! git cat-file -e "$REF^{commit}" 2>/dev/null; then
                          echo "::error::$REF isn't a commit in this repository or upstream"
                          exit 1
                      fi
                      git checkout --detach "$REF"
                      echo "SYNCED=0" >> "$GITHUB_ENV"
                  else
                      was=$(git rev-parse HEAD)
                      git fetch --no-tags upstream main
                      # --ff-only enforces the one rule this fork has. If main ever
                      # picks up a commit of our own, fail here instead of quietly
                      # writing a merge commit onto the mirror.
                      git merge --ff-only upstream/main
                      if [ "$SYNC_MAIN" = 'true' ]; then
                          git push origin main
                      fi
                      echo "SYNCED=$(git rev-list --count "$was"..HEAD)" >> "$GITHUB_ENV"
                  fi

                  echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
                  echo "SOURCE_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

            - uses: actions/setup-node@v4
              if: env.MODE != 'sync'
              with:
                  node-version: 24
            - uses: pnpm/action-setup@v4.1.0
              if: env.MODE != 'sync'
            - uses: actions/setup-go@v5
              if: env.MODE != 'sync'
              with:
                  go-version-file: go.mod
                  cache: true

            - run: pnpm install --frozen-lockfile
              if: env.MODE != 'sync'

            - name: Stamp a preview version on the Go packages
              if: env.MODE != 'sync'
              # Each Go package's postinstall downloads <name>-<platform>@<version>
              # from npm when its optional platform package is missing. Left at the
              # released version, that fallback pairs upstream's published binary
              # with this preview's JavaScript and says nothing about it. A version
              # npm cannot answer turns that silence into a 404.
              run: |
                  for pkg in $GO_PACKAGES; do
                      version=$(node -p "require('./packages/$pkg/package.json').version")
                      # One hyphenated prerelease identifier, so a sha like 0040273
                      # stays valid semver. Numeric identifiers can't lead with a 0.
                      (cd "packages/$pkg" && npm pkg set "version=$version-preview-$SOURCE_SHORT")
                  done

            - run: pnpm run build
              if: env.MODE != 'sync'

            # The binaries are packed straight out of the build directory, so the
            # executable bit has to survive. Upstream's CI does the same.
            - run: find ./packages -path '*/bin/houdini-*' -type f -exec chmod +x {} +
              if: env.MODE != 'sync'

            - name: Collect publish targets
              if: env.MODE != 'sync'
              run: |
                  targets=(
                      ./packages/houdini
                      ./packages/houdini-lsp
                      ./packages/create-houdini
                      ./packages/adapter-auto
                      ./packages/adapter-cloudflare
                      ./packages/adapter-node
                      ./packages/adapter-static
                      ./packages/sv-addon
                  )
                  # A Go package's platform packages have to go out in the same run
                  # as the package itself. pkg.pr.new only rewrites a dependency
                  # when whatever it points at is published alongside it, and that
                  # rewrite is what moves optionalDependencies off npm and onto this
                  # build's binaries.
                  for pkg in $GO_PACKAGES; do
                      targets+=("./packages/$pkg/build/$pkg")
                      for platform in $PLATFORMS; do
                          targets+=("./packages/$pkg/build/$pkg-$platform")
                      done
                  done

                  for target in "${targets[@]}"; do
                      if [ ! -f "$target/package.json" ]; then
                          echo "::error::$target/package.json is missing. Did the build layout change?"
                          exit 1
                      fi
                  done

                  echo "TARGETS=${targets[*]}" >> "$GITHUB_ENV"
                  echo "PAYLOAD=$(du -ch "${targets[@]}" | tail -1 | cut -f1)" >> "$GITHUB_ENV"

            - name: Resolve workspace specs and prune unbuilt platforms
              if: env.MODE != 'sync'
              run: node .preview/scripts/prepare-publish.mjs

            - name: Publish to pkg.pr.new
              if: env.MODE != 'sync'
              # Needs the pkg.pr.new GitHub App installed on this repository.
              # --no-compact: a compact URL is resolved through the npm package's
              # repository field, which points at upstream. Previews from this fork
              # have to be addressed as /knd775/houdini/<pkg>@<sha>.
              # --comment=off: there's no PR here, and the report back to the issue
              # below is the comment we want.
              # --json=<file>: the = form binds it as a path. `json` is a
              # mixed-type arg, and a bare --json prints the metadata instead.
              run: >-
                  npx pkg-pr-new@0.0.88 publish
                  --no-compact --comment=off --no-template --pnpm
                  --json=preview.json
                  $TARGETS

            - name: Summarize install URLs
              if: env.MODE != 'sync'
              run: |
                  {
                      echo "## Preview of \`$UPSTREAM@$SOURCE_SHORT\`"
                      echo
                      echo "Built from \`$SOURCE_SHA\`. Payload: $PAYLOAD."
                      echo
                      echo '| package | install |'
                      echo '| --- | --- |'
                      jq -r '.packages[]? | "| `\(.name)` | `pnpm add \(.url)` |"' preview.json
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Report back on the issue
              if: always() && env.ISSUE != ''
              run: |
                  run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

                  outcome=rocket

                  if [ "$MODE" = 'sync' ]; then
                      if [ "${SYNCED:-0}" -gt 0 ]; then
                          echo "Fast-forwarded \`main\` to \`$SOURCE_SHORT\`, $SYNCED commits from upstream." > comment.md
                      elif [ -n "$SOURCE_SHORT" ]; then
                          echo "\`main\` is already at \`$SOURCE_SHORT\`. Nothing to sync." > comment.md
                      else
                          # The only way to get here is main having drifted, which
                          # --ff-only refuses to paper over.
                          echo "Sync failed. [Run log]($run_url)" > comment.md
                          outcome='-1'
                      fi
                  elif [ -f preview.json ]; then
                      {
                          echo "Preview of \`$UPSTREAM@$SOURCE_SHORT\` ([run]($run_url)):"
                          echo
                          echo '```bash'
                          jq -r '.packages[] | select(.name | test("-(linux|darwin|win32)-|-wasm$") | not) | "pnpm add \(.url)"' preview.json
                          echo '```'
                          echo
                          echo "Platform binaries are installed automatically."
                      } > comment.md
                  else
                      echo "Preview build failed before publishing anything. [Run log]($run_url)" > comment.md
                      outcome='-1'
                  fi

                  gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md

                  # Swap the acknowledgement for the outcome, so the request that
                  # started a run also shows how it ended.
                  if [ -n "$COMMENT_ID" ]; then
                      reactions="repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions"
                      eyes=$(gh api "$reactions" --jq 'map(select(.content == "eyes")) | .[0].id // empty')
                      if [ -n "$eyes" ]; then
                          gh api --silent -X DELETE "$reactions/$eyes"
                      fi
                      gh api --silent -X POST "$reactions" -f content="$outcome"
                  fi
